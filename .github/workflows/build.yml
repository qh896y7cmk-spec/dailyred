# Daily Red build — getest op 26 oktober 2026 (versie 3: dagregels + slimme teams).
# Zet dit bestand in je eigen kopie (fork) van amoi-builds/dailyred als
# .github/workflows/build.yml, ga naar Actions en klik "Run workflow".
# Daarna download je bij Artifacts het zip-archief "dailyred", pak je het uit,
# en krijg je een gewoon spelbestand: dailyred.gba. Dat laad je in de site.
name: Build Daily Red
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pokefirered and apply the Daily Red patch
        run: bash scripts/get-pokefirered.sh

      - name: Emiles dagpuzzel extras (moeilijkheid, legendary, items)
        working-directory: pokefirered
        run: |
          cat > extras.py <<'PYEOF'
          #!/usr/bin/env python3
          # Emiles dagpuzzel: makes the team rules adjustable from the website.
          # Run from the pokefirered/ folder after the Daily Red patch.
          import re, sys

          def edit(path, old, new, count=1):
              s = open(path).read()
              if s.count(old) != count:
                  sys.exit(f"extras: pattern not found in {path}: {old[:60]!r}")
              open(path, 'w').write(s.replace(old, new))

          c = 'src/dailyred.c'
          edit(c, """    u8 daily;    // TRUE: the website's daily game (one battle, then the game ends)
              u8 padding[3];
          };""", """    u8 daily;    // TRUE: the website's daily game (one battle, then the game ends)
              u8 legendary; // 0 = normal odds, 1 = always one legendary, 2 = never
              u8 minIv;     // 0 = default, else lowest random IV (max 31)
              u8 padding;
              u16 minBst;   // 0 = default, else minimum combined base stat total
              u16 items[6]; // 0 = random item, else held item for that party slot
          };""")
          edit(c, "'C', 'O', 'N', 'F', '-', 'V', '2'", "'C', 'O', 'N', 'F', '-', 'V', '3'")
          edit(c, "static void InitStatus(u32 seed)", """u8 DailyRed_ConfLegendary(void) { return *(const vu8 *)&gDailyRedRomConfig.legendary; }
          u8 DailyRed_ConfMinIv(void) { return *(const vu8 *)&gDailyRedRomConfig.minIv; }
          u16 DailyRed_ConfMinBst(void) { return *(const vu16 *)&gDailyRedRomConfig.minBst; }
          u16 DailyRed_ConfItem(u8 slot) { return *(const vu16 *)&gDailyRedRomConfig.items[slot]; }

          static void InitStatus(u32 seed)""")

          h = 'include/dailyred.h'
          edit(h, "// src/dailyred_team.c", """u8 DailyRed_ConfLegendary(void);
          u8 DailyRed_ConfMinIv(void);
          u16 DailyRed_ConfMinBst(void);
          u16 DailyRed_ConfItem(u8 slot);

          // src/dailyred_team.c""")

          t = 'src/dailyred_team.c'
          edit(t, """    if (TeamRandom(rng) % LEGENDARY_TEAM_ODDS == 0)
                  species[first++]""", """    u32 minBst = DailyRed_ConfMinBst() ? DailyRed_ConfMinBst() : MIN_TEAM_BASE_STAT_TOTAL;
              u8 legend = DailyRed_ConfLegendary();
              bool8 rolled = TeamRandom(rng) % LEGENDARY_TEAM_ODDS == 0;

              if (legend == 1 || (legend == 0 && rolled))
                  species[first++]""")
          edit(t, "if (total >= MIN_TEAM_BASE_STAT_TOTAL)", "if (total >= minBst)")
          edit(t, """    u8 i, iv;

              for (i = 0; i < NUM_STATS; i++)
              {
                  iv = MIN_TEAM_IV + TeamRandom(rng) % (MAX_PER_STAT_IVS - MIN_TEAM_IV + 1);""", """    u8 i, iv;
              u8 minIv = DailyRed_ConfMinIv();

              if (minIv == 0 || minIv > MAX_PER_STAT_IVS)
                  minIv = MIN_TEAM_IV;
              for (i = 0; i < NUM_STATS; i++)
              {
                  iv = minIv + TeamRandom(rng) % (MAX_PER_STAT_IVS - minIv + 1);""")
          edit(t, """            FinishTeamMon(&party[i], rngState);
                  }
              }
          }""", """            FinishTeamMon(&party[i], rngState);
                  }
              }

              // Emiles dagpuzzel: the website may pick held items per slot.
              for (i = 0; i < PARTY_SIZE; i++)
              {
                  u16 item = DailyRed_ConfItem(i);
                  if (item != ITEM_NONE && item < ITEMS_COUNT)
                      SetMonData(&party[i], MON_DATA_HELD_ITEM, &item);
              }
          }""")
          print("extras: applied")

          PYEOF
          python3 extras.py

      - name: Emiles dagpuzzel slimme teams (eindevoluties, goede aanvallen, passende items)
        working-directory: pokefirered
        run: |
          cat > smart.py <<'PYEOF'
          #!/usr/bin/env python3
          # Emiles dagpuzzel: smarter player teams (fully evolved Pokemon, strong and
          # sensible movesets, items that fit the Pokemon). Run from pokefirered/ after
          # the Daily Red patch and extras.py. Everything still uses the team's own
          # seeded RNG, so one date always gives the same team.
          import re, sys

          T = 'src/dailyred_team.c'
          src = open(T).read()
          src = src.replace('#include "constants/items.h"', '#include "battle.h"\n#include "constants/battle_move_effects.h"\n#include "constants/items.h"', 1)

          def replace_func(signature, body):
              global src
              start = src.find(signature)
              if start < 0 or src.count(signature) != 1:
                  sys.exit(f"smart: function not found: {signature}")
              end = src.find("\n}\n", start)
              if end < 0:
                  sys.exit(f"smart: end of function not found: {signature}")
              src = src[:start] + body.strip("\n") + src[end + 2:]

          replace_func("static bool8 IsEligibleSpecies(u16 species)", r'''
          // Which species may appear on the player's team: fully evolved Pokemon with a
          // base stat total of at least MIN_SPECIES_BST, minus a few that can't fight
          // with random moves (Ditto, Smeargle, Unown, Wobbuffet, Shedinja).
          #define MIN_SPECIES_BST 430
          extern const struct Evolution gEvolutionTable[][EVOS_PER_MON];
          static bool8 IsEligibleSpecies(u16 species)
          {
              u8 k;
              const struct SpeciesInfo *info;

              if (species == SPECIES_NONE || species >= NUM_SPECIES)
                  return FALSE;
              // Unused placeholder slots between Celebi and Treecko.
              if (species >= SPECIES_OLD_UNOWN_B && species <= SPECIES_OLD_UNOWN_Z)
                  return FALSE;
              if (species == SPECIES_DITTO || species == SPECIES_SMEARGLE || species == SPECIES_UNOWN
               || species == SPECIES_WOBBUFFET || species == SPECIES_SHEDINJA)
                  return FALSE;
              for (k = 0; k < EVOS_PER_MON; k++)
              {
                  if (gEvolutionTable[species][k].method != 0)
                      return FALSE;
              }
              info = &gSpeciesInfo[species];
              if (info->baseHP + info->baseAttack + info->baseDefense + info->baseSpeed
                + info->baseSpAttack + info->baseSpDefense < MIN_SPECIES_BST)
                  return FALSE;
              return TRUE;
          }
          ''')

          replace_func("static void AssignRandomMoves(struct Pokemon *mon, u32 *rng)", r'''
          // --- Smart movesets -----------------------------------------------------------
          // Every candidate is still a legal level-up or TM/HM move. Damaging moves get a
          // score: power x accuracy x STAB x the attacking stat Gen 3 uses for that type.
          // Moves that rarely work with random sets (Dream Eater without sleep, Snore,
          // Focus Punch, charge-up and self-KO moves) are skipped. The set is built as:
          //   1. a strong STAB attack, 2. a strong attack of another type (coverage),
          //   3. sometimes one useful support move (setup, recovery, status),
          //   4. the rest strong attacks of new types.
          // Each pick is random among the moves close to the best, for daily variety.

          enum { ROLE_NONE, ROLE_SETUP_PHYS, ROLE_SETUP_SPEC, ROLE_RECOVER, ROLE_STATUS, ROLE_SLEEP, ROLE_REST, ROLE_SUB };

          static u8 SupportRole(u16 move, bool8 physical)
          {
              const struct BattleMove *m = &gBattleMoves[move];

              switch (m->effect)
              {
              case EFFECT_ATTACK_UP_2:
              case EFFECT_DRAGON_DANCE:
              case EFFECT_BULK_UP:
                  return physical ? ROLE_SETUP_PHYS : ROLE_NONE;
              case EFFECT_SPECIAL_ATTACK_UP_2:
              case EFFECT_CALM_MIND:
                  return physical ? ROLE_NONE : ROLE_SETUP_SPEC;
              case EFFECT_RESTORE_HP:
              case EFFECT_SOFTBOILED:
              case EFFECT_MORNING_SUN:
              case EFFECT_SYNTHESIS:
              case EFFECT_MOONLIGHT:
                  return ROLE_RECOVER;
              case EFFECT_REST:
                  return ROLE_REST;
              case EFFECT_SLEEP:
                  return m->accuracy >= 75 ? ROLE_SLEEP : ROLE_NONE;
              case EFFECT_PARALYZE:
              case EFFECT_WILL_O_WISP:
              case EFFECT_TOXIC:
              case EFFECT_LEECH_SEED:
                  return m->accuracy >= 75 || m->accuracy == 0 ? ROLE_STATUS : ROLE_NONE;
              case EFFECT_SUBSTITUTE:
                  return ROLE_SUB;
              }
              return ROLE_NONE;
          }

          static u32 MoveScore(u16 move, u16 species, bool8 sleepOk)
          {
              const struct BattleMove *m = &gBattleMoves[move];
              const struct SpeciesInfo *info = &gSpeciesInfo[species];
              u32 power = m->power, acc = m->accuracy ? m->accuracy : 100, stat, score;

              if (power == 0)
                  return 0;
              switch (m->effect)
              {
              case EFFECT_DREAM_EATER:
                  if (!sleepOk)
                      return 0;
                  break;
              case EFFECT_SNORE: case EFFECT_FOCUS_PUNCH: case EFFECT_FALSE_SWIPE: case EFFECT_SOLAR_BEAM:
              case EFFECT_RAZOR_WIND: case EFFECT_SKY_ATTACK: case EFFECT_SKULL_BASH: case EFFECT_EXPLOSION:
              case EFFECT_FUTURE_SIGHT: case EFFECT_SPIT_UP: case EFFECT_FAKE_OUT: case EFFECT_PRESENT:
              case EFFECT_DRAGON_RAGE: case EFFECT_SONICBOOM: case EFFECT_OHKO: case EFFECT_SUPER_FANG:
              case EFFECT_ENDEAVOR: case EFFECT_TRAP:
                  return 0;
              case EFFECT_LEVEL_DAMAGE: power = 75; break;   // Seismic Toss / Night Shade: 100 HP
              case EFFECT_PSYWAVE: power = 55; break;
              case EFFECT_RETURN: power = 40; break;         // low friendship on a fresh team
              case EFFECT_FRUSTRATION: power = 70; break;
              case EFFECT_HIDDEN_POWER: power = 45; break;   // random type, rarely STAB
              case EFFECT_FLAIL: case EFFECT_LOW_KICK: case EFFECT_MAGNITUDE: power = 60; break;
              case EFFECT_ERUPTION: power = 110; break;
              case EFFECT_MULTI_HIT: power *= 3; break;
              case EFFECT_DOUBLE_HIT: power *= 2; break;
              case EFFECT_TRIPLE_KICK: power = 40; break;
              case EFFECT_RECHARGE: power = power * 6 / 10; break;
              case EFFECT_SEMI_INVULNERABLE: power = power * 85 / 100; break;
              case EFFECT_OVERHEAT: case EFFECT_SUPERPOWER: power = power * 85 / 100; break;
              case EFFECT_RECOIL_IF_MISS: power = power * 9 / 10; break;
              }
              if (power <= 1)
                  return 0;

              stat = IS_TYPE_PHYSICAL(m->type) ? info->baseAttack : info->baseSpAttack;
              score = power * acc / 100 * stat;
              if (m->effect != EFFECT_LEVEL_DAMAGE && m->effect != EFFECT_PSYWAVE && m->effect != EFFECT_HIDDEN_POWER
               && (m->type == info->types[0] || m->type == info->types[1]))
                  score = score * 3 / 2;
              if (m->effect == EFFECT_LEVEL_DAMAGE || m->effect == EFFECT_PSYWAVE)
                  score = power * 100;                        // ignores stats
              return score;
          }

          static u32 sMinScore;

          static bool8 HasMove(const u16 *set, u8 n, u16 move)
          {
              u8 i;
              for (i = 0; i < n; i++)
                  if (set[i] == move)
                      return TRUE;
              return FALSE;
          }

          static bool8 HasMoveType(const u16 *set, u8 n, u8 type)
          {
              u8 i;
              for (i = 0; i < n; i++)
                  if (gBattleMoves[set[i]].power != 0 && gBattleMoves[set[i]].type == type)
                      return TRUE;
              return FALSE;
          }

          // Random attack among those scoring at least pct% of the best match.
          // mode 0: STAB only, 1: type not used yet, 2: anything not picked yet.
          static u16 PickAttack(const u16 *moves, u8 count, const u16 *set, u8 n, u16 species, bool8 sleepOk, u8 mode, u8 pct, u32 *rng)
          {
              const struct SpeciesInfo *info = &gSpeciesInfo[species];
              u32 best = 0, s;
              u8 i, matches = 0, pick;

              for (i = 0; i < count; i++)
              {
                  u8 type = gBattleMoves[moves[i]].type;
                  if (HasMove(set, n, moves[i]))
                      continue;
                  if (mode == 0 && type != info->types[0] && type != info->types[1])
                      continue;
                  if (mode == 1 && HasMoveType(set, n, type))
                      continue;
                  s = MoveScore(moves[i], species, sleepOk);
                  if (s < sMinScore)
                      continue;
                  if (s > best)
                      best = s;
              }
              if (best == 0)
                  return MOVE_NONE;
              for (i = 0; i < count; i++)
              {
                  u8 type = gBattleMoves[moves[i]].type;
                  if (HasMove(set, n, moves[i]) || (mode == 0 && type != info->types[0] && type != info->types[1]) || (mode == 1 && HasMoveType(set, n, type)))
                      continue;
                  if (MoveScore(moves[i], species, sleepOk) >= sMinScore && MoveScore(moves[i], species, sleepOk) * 100 >= best * pct)
                      matches++;
              }
              pick = TeamRandom(rng) % matches;
              for (i = 0; i < count; i++)
              {
                  u8 type = gBattleMoves[moves[i]].type;
                  if (HasMove(set, n, moves[i]) || (mode == 0 && type != info->types[0] && type != info->types[1]) || (mode == 1 && HasMoveType(set, n, type)))
                      continue;
                  if (MoveScore(moves[i], species, sleepOk) >= sMinScore && MoveScore(moves[i], species, sleepOk) * 100 >= best * pct && pick-- == 0)
                      return moves[i];
              }
              return MOVE_NONE;
          }

          static void AssignRandomMoves(struct Pokemon *mon, u32 *rng)
          {
              u16 moves[MAX_CANDIDATE_MOVES];
              u16 support[MAX_CANDIDATE_MOVES * 3];
              u16 set[MAX_MON_MOVES] = {MOVE_NONE, MOVE_NONE, MOVE_NONE, MOVE_NONE};
              u16 species = GetMonData(mon, MON_DATA_SPECIES);
              const struct SpeciesInfo *info = &gSpeciesInfo[species];
              bool8 physical = info->baseAttack >= info->baseSpAttack;
              bool8 sleepOk = FALSE;
              u8 count, nSupport = 0, n = 0, i, role;
              u16 move;

              count = GetLearnableMoves(mon, moves);
              for (i = 0; i < count; i++)
              {
                  // Setup, recovery, sleep and paralysis/burn/Leech Seed weigh 3,
                  // the moves nearly everything learns (Rest, Toxic, Substitute) 1.
                  role = SupportRole(moves[i], physical);
                  if (role != ROLE_NONE)
                      support[nSupport++] = moves[i];
                  if (role != ROLE_NONE && role != ROLE_REST && role != ROLE_SUB && gBattleMoves[moves[i]].effect != EFFECT_TOXIC)
                  {
                      support[nSupport++] = moves[i];
                      support[nSupport++] = moves[i];
                  }
              }

              // 1. STAB, 2. coverage.
              sMinScore = 0;
              move = PickAttack(moves, count, set, n, species, FALSE, 0, 85, rng);
              if (move == MOVE_NONE)
                  move = PickAttack(moves, count, set, n, species, FALSE, 2, 85, rng);
              if (move != MOVE_NONE)
                  set[n++] = move;
              move = PickAttack(moves, count, set, n, species, FALSE, 1, 75, rng);
              if (move != MOVE_NONE)
                  set[n++] = move;

              // 3. One support move in about 3 of 5 sets (always if it can barely attack).
              if (nSupport != 0 && (n < 2 || TeamRandom(rng) % 5 < 3))
              {
                  move = support[TeamRandom(rng) % nSupport];
                  set[n++] = move;
                  if (SupportRole(move, physical) == ROLE_SLEEP)
                      sleepOk = TRUE;
              }

              // 4. Fill with strong attacks, new types first; never a weak filler like
              // Rock Smash (under half the score of the main attack).
              sMinScore = set[0] != MOVE_NONE ? MoveScore(set[0], species, FALSE) / 2 : 0;
              while (n < MAX_MON_MOVES)
              {
                  move = PickAttack(moves, count, set, n, species, sleepOk, 1, 65, rng);
                  if (move == MOVE_NONE)
                      move = PickAttack(moves, count, set, n, species, sleepOk, 2, 70, rng);
                  if (move == MOVE_NONE)
                      break;
                  set[n++] = move;
              }
              sMinScore = 0;
              // No strong attacks left: top up with support moves instead.
              for (i = 0; n < MAX_MON_MOVES && i < nSupport; i++)
              {
                  if (!HasMove(set, n, support[i]))
                      set[n++] = support[i];
              }
              // Last resort: any learnable move (never an empty Pokemon).
              for (i = 0; n < MAX_MON_MOVES && n < count && i < count; i++)
              {
                  if (n == 0 && !HasMove(set, n, moves[i]))
                      set[n++] = moves[i];
              }

              for (i = 0; i < MAX_MON_MOVES; i++)
                  SetMonMoveSlot(mon, set[i], i);
          }
          ''')

          replace_func("static void AssignRandomItem(struct Pokemon *mon, u32 *rng)", r'''
          // Held item picked by weight to fit the Pokemon: Choice Band only for a fully
          // physical attacker with four attacks, Chesto Berry with Rest, more Leftovers
          // for bulky or recovering Pokemon, more Quick Claw for slow ones. Every item
          // here works in the Gen 3 battle engine as is.
          static void AssignRandomItem(struct Pokemon *mon, u32 *rng)
          {
              u16 items[24];
              u8 weights[24];
              u8 count = 0, i, physAttacks = 0, attacks = 0;
              u16 species = GetMonData(mon, MON_DATA_SPECIES);
              const struct SpeciesInfo *info = &gSpeciesInfo[species];
              bool8 physical = info->baseAttack >= info->baseSpAttack;
              bool8 hasRest = FALSE, sustain = FALSE;
              u16 move, item;
              u32 total = 0, roll;

              for (i = 0; i < MAX_MON_MOVES; i++)
              {
                  move = GetMonData(mon, MON_DATA_MOVE1 + i);
                  if (move == MOVE_NONE)
                      continue;
                  if (gBattleMoves[move].power != 0)
                  {
                      attacks++;
                      if (IS_TYPE_PHYSICAL(gBattleMoves[move].type))
                          physAttacks++;
                  }
                  switch (gBattleMoves[move].effect)
                  {
                  case EFFECT_REST: hasRest = TRUE; break;
                  case EFFECT_SUBSTITUTE: case EFFECT_LEECH_SEED: case EFFECT_RESTORE_HP: case EFFECT_SOFTBOILED:
                  case EFFECT_MORNING_SUN: case EFFECT_SYNTHESIS: case EFFECT_MOONLIGHT:
                      sustain = TRUE; break;
                  }
              }
              if (hasRest)
              {
                  item = (TeamRandom(rng) % 3 == 0) ? ITEM_LUM_BERRY : ITEM_CHESTO_BERRY;
                  SetMonData(mon, MON_DATA_HELD_ITEM, &item);
                  return;
              }

          #define ADD_ITEM(it, w) do { items[count] = (it); weights[count] = (w); total += (w); count++; } while (0)
              ADD_ITEM(ITEM_QUICK_CLAW, info->baseSpeed < 80 ? 6 : 3);
              ADD_ITEM(ITEM_LEFTOVERS, (sustain || info->baseHP + info->baseDefense + info->baseSpDefense >= 270) ? 6 : 3);
              ADD_ITEM(ITEM_LUM_BERRY, 3);
              ADD_ITEM(ITEM_SITRUS_BERRY, 2);
              ADD_ITEM(ITEM_FOCUS_BAND, 1);
              ADD_ITEM(ITEM_SCOPE_LENS, 1);
              ADD_ITEM(ITEM_SHELL_BELL, 1);
              ADD_ITEM(ITEM_BRIGHT_POWDER, 1);
              if (attacks == MAX_MON_MOVES && physAttacks == MAX_MON_MOVES && physical)
                  ADD_ITEM(ITEM_CHOICE_BAND, 5);
              if (physical && physAttacks != 0)
                  ADD_ITEM(ITEM_LIECHI_BERRY, 1);
              if (!physical && physAttacks < attacks)
                  ADD_ITEM(ITEM_PETAYA_BERRY, 1);
              if (info->baseSpeed >= 80)
                  ADD_ITEM(ITEM_SALAC_BERRY, 1);
              // Type booster for its own STAB attacks.
              for (i = 0; i < MAX_MON_MOVES; i++)
              {
                  move = GetMonData(mon, MON_DATA_MOVE1 + i);
                  if (gBattleMoves[move].power > 1 && (gBattleMoves[move].type == info->types[0] || gBattleMoves[move].type == info->types[1])
                   && sTypeBoostItems[gBattleMoves[move].type] != ITEM_NONE)
                  {
                      ADD_ITEM(sTypeBoostItems[gBattleMoves[move].type], 2);
                      break;
                  }
              }
          #undef ADD_ITEM

              roll = TeamRandom(rng) % total;
              for (i = 0; i < count - 1 && roll >= weights[i]; i++)
                  roll -= weights[i];
              item = items[i];
              SetMonData(mon, MON_DATA_HELD_ITEM, &item);
          }
          ''')

          open(T, 'w').write(src)
          print("smart: applied")
          PYEOF
          python3 smart.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
          mkdir -p .toolchain/arm-none-eabi
          curl -fsL https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz \
            | tar xz -C .toolchain/arm-none-eabi --strip-components=1

      - name: Build the ROM
        run: make -C pokefirered -j"$(nproc)" TOOLCHAIN="$PWD/.toolchain/arm-none-eabi" MODERN=1

      - name: Package for the website
        run: |
          mkdir -p web/game
          cp pokefirered/pokefirered_modern.gba web/game/dailyred.gba

      - uses: actions/upload-artifact@v4
        with:
          name: dailyred
          path: web/game/dailyred.gba
